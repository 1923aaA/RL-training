<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图例测试</title>
</head>
<body>
    <h1>图例数据测试</h1>
    <div id="output"></div>

    <script>
        // 从 index.js 复制的常量
        const CLUSTER_COLORS = {
            "组网 1": "#FF4949",
            "组网 2": "#FFA74D",
            "组网 3": "#77CD63",
            "组网 4": "#44AFF0"
        };

        // 加载 Cluster_info.json
        fetch('Cluster_info.json')
            .then(response => response.json())
            .then(clusterData => {
                const output = document.getElementById('output');
                
                // 检查 metadata
                output.innerHTML += '<h2>Metadata 中的组网信息:</h2>';
                if (clusterData.metadata && clusterData.metadata.ranges && clusterData.metadata.ranges['组网信息']) {
                    const clusterNames = clusterData.metadata.ranges['组网信息'];
                    output.innerHTML += '<ul>';
                    clusterNames.forEach(name => {
                        const color = CLUSTER_COLORS[name];
                        output.innerHTML += `<li>"${name}" - 在 CLUSTER_COLORS 中: ${color ? '✓ (' + color + ')' : '✗ 未找到'}</li>`;
                    });
                    output.innerHTML += '</ul>';
                } else {
                    output.innerHTML += '<p>未找到 metadata.ranges.组网信息</p>';
                }

                // 检查实际数据
                output.innerHTML += '<h2>实际数据中的组网信息 (去重):</h2>';
                const uniqueClusterNames = [...new Set(clusterData.data.map(node => node['组网信息']))];
                output.innerHTML += '<ul>';
                uniqueClusterNames.forEach(name => {
                    const color = CLUSTER_COLORS[name];
                    output.innerHTML += `<li>"${name}" - 在 CLUSTER_COLORS 中: ${color ? '✓ (' + color + ')' : '✗ 未找到'}</li>`;
                });
                output.innerHTML += '</ul>';

                // 显示 CLUSTER_COLORS 的键
                output.innerHTML += '<h2>CLUSTER_COLORS 中定义的键:</h2>';
                output.innerHTML += '<ul>';
                Object.keys(CLUSTER_COLORS).forEach(key => {
                    output.innerHTML += `<li>"${key}" (长度: ${key.length}, Unicode: ${[...key].map(c => c.charCodeAt(0)).join(', ')})</li>`;
                });
                output.innerHTML += '</ul>';
            })
            .catch(error => {
                document.getElementById('output').innerHTML = '<p style="color:red;">加载失败: ' + error.message + '</p>';
            });
    </script>
</body>
</html>
