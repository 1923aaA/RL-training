<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>集群网络仿真平台综合态势 - AFSIM</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link href="css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/index.css">
    <style>
        .t_title { width:100%; height:100%; text-align:center; font-size:2.5em; line-height:80px; color:#fff; }
        .main_title { text-align:center; }
        .centertable { width:100%; border-collapse:collapse; color:#cceeff; font-size:13px; margin-top:25px; }
        .centertable th, .centertable td { border:1px solid #2a6aa5; padding:10px 8px; text-align:center; background-color:transparent; }
        .centertable th { background-color:#183d6a; color:#e0ffe2; font-weight:bold; }
        .centertable tbody tr:nth-child(odd) { background-color:#0d2540; }
        .centertable tbody tr:nth-child(even) { background-color:#102f50; }
        .table-scroll-container::-webkit-scrollbar { width:15px; }
        .table-scroll-container::-webkit-scrollbar-track { background:#0d2540; border-radius:4px; }
        .table-scroll-container::-webkit-scrollbar-thumb { background-color:#2a6aa5; border-radius:4px; border:2px solid #0d2540; }

        /* AFSIM 全宽两栏布局 */
        .afsim-content {
            min-width: 800px;
            padding: 5px 20px;
            box-sizing: border-box;
            height: calc(100vh - 80px);
            display: flex;
            gap: 25px;
        }
        /* 左侧：平台信息 */
        .afsim-left {
            flex: 3;
            height: 100%;
            box-sizing: border-box;
            border: 1px solid #2C58A6;
            position: relative;
            box-shadow: 0 0 10px #2C58A6;
        }
        .afsim-left .main_title {
            width: 180px; height: 35px; line-height: 33px;
            background-color: #2C58A6; border-radius: 18px;
            position: absolute; top: -17px; left: 50%; margin-left: -90px;
            color: #fff; font-size: 18px; font-weight: 600;
            box-sizing: border-box; padding-left: 45px; z-index: 1000;
        }
        .afsim-left .main_title img { position: absolute; top: 8px; left: 20px; }
        #produce {
            height: calc(100% - 30px);
            overflow-y: auto;
            padding: 15px;
        }

        /* 右侧：协同效能统计 */
        .afsim-right {
            flex: 2;
            height: 100%;
            box-sizing: border-box;
            border: 1px solid #2C58A6;
            position: relative;
            box-shadow: 0 0 10px #2C58A6;
        }
        .afsim-right .main_title {
            width: 200px; height: 35px; line-height: 33px;
            background-color: #2C58A6; border-radius: 18px;
            position: absolute; top: -17px; left: 50%; margin-left: -100px;
            color: #fff; font-size: 18px; font-weight: 600;
            box-sizing: border-box; padding-left: 45px; z-index: 1000;
        }
        .afsim-right .main_title img { position: absolute; top: 8px; left: 20px; }

        /* 协同效能面板 */
        .sim-stats-panel {
            display: flex; flex-direction: column;
            height: calc(100% - 25px);
            padding: 20px 15px 10px 15px;
            box-sizing: border-box;
        }
        .sim-target-list {
            display: flex; flex-wrap: wrap; gap: 8px;
            padding: 10px 0 12px 0;
            border-bottom: 1px solid #2a4a7a;
            min-height: 36px;
            align-items: center;
        }
        .sim-target-list .sim-no-target { color:#4E72B0; font-size:14px; width:100%; text-align:center; }
        .sim-target-btn {
            padding: 5px 16px; border-radius: 3px; font-size: 14px;
            cursor: pointer; border: 1px solid #2a6aa5; background: transparent;
            color: #4ADEFE; transition: all 0.15s; user-select: none;
        }
        .sim-target-btn:hover { background: #183d6a; }
        .sim-target-btn.active { background: #2C58A6; color: #fff; border-color: #4ADEFE; }
        .sim-detail-view { flex:1; display:flex; align-items:center; justify-content:center; }
        .sim-detail-item { flex:1; text-align:center; color:#4ADEFE; }
        .sim-detail-item:nth-child(2) { border-left:1px solid #4E72B0; border-right:1px solid #4E72B0; }
        .sim-detail-item .sim-label { font-size:18px; }
        .sim-detail-item .sim-value { margin-top:8px; font-size:18px; }
        .sim-detail-item .sim-value span { font-size:36px; color:#F3DB5C; font-family:'Times New Roman',serif; font-style:normal; }
        .sim-detail-item .sim-unit { font-size:16px; color:#4ADEFE; }
    </style>
</head>
<body>
<div class="header">
    <div class="bg_header">
        <div class="header_nav fl t_title">集群网络仿真平台综合态势</div>
    </div>
</div>

<div class="afsim-content">
    <!-- 左侧：平台信息 -->
    <div class="afsim-left">
        <div class="t_line_box"><i class="t_l_line"></i><i class="l_t_line"></i></div>
        <div class="t_line_box"><i class="t_r_line"></i><i class="r_t_line"></i></div>
        <div class="t_line_box"><i class="l_b_line"></i><i class="b_l_line"></i></div>
        <div class="t_line_box"><i class="r_b_line"></i><i class="b_r_line"></i></div>
        <div class="main_title"><img src="img/t_2.png" alt="">平台信息</div>
        <div id="produce" class="table-scroll-container"></div>
    </div>

    <!-- 右侧：协同效能统计 -->
    <div class="afsim-right">
        <div class="t_line_box"><i class="t_l_line"></i><i class="l_t_line"></i></div>
        <div class="t_line_box"><i class="t_r_line"></i><i class="r_t_line"></i></div>
        <div class="t_line_box"><i class="l_b_line"></i><i class="b_l_line"></i></div>
        <div class="t_line_box"><i class="r_b_line"></i><i class="b_r_line"></i></div>
        <div class="main_title"><img src="img/t_4.png" alt="">协同效能统计</div>
        <div class="sim-stats-panel">
            <div class="sim-target-list" id="sim_target_list">
                <span class="sim-no-target">暂无探测目标</span>
            </div>
            <div class="sim-detail-view" id="sim_detail_view">
                <div class="sim-detail-item">
                    <div class="sim-label">目标节点</div>
                    <div class="sim-value"><span id="sim_node_id">--</span></div>
                </div>
                <div class="sim-detail-item">
                    <div class="sim-label">目标发现时间</div>
                    <div class="sim-value"><span id="sim_discovery_time">--</span><span class="sim-unit">毫秒</span></div>
                </div>
                <div class="sim-detail-item">
                    <div class="sim-label">OODA闭环时间</div>
                    <div class="sim-value"><span id="sim_ooda_time">--</span><span class="sim-unit">毫秒</span></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/jquery-2.2.1.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/common.js"></script>
<script src="js/index.js"></script>
</body>
</html>
